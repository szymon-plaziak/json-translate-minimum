[project]
name = "robotctl"
version = "0.1.0"
description = "Universal robot controller: natural language in, validated JSON plans out, executed on a real robot over HTTP."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
robotctl = "robotctl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robotctl"]
